<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zstreamer 開發心路歷程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1020;
    --card: #111831;
    --card-hover: #172242;
    --border: #23325c;
    --text: #e9ecf5;
    --muted: #94a3b8;
    --accent: #7cc7ff;
    --accent-glow: rgba(124, 199, 255, 0.15);
    --accent-2: #8ef5d0;
    --green: #34d399;
    --amber: #fbbf24;
    --purple: #c084fc;
    --rose: #f43f5e;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at 20% 10%, #1c2854 0%, var(--bg) 50%), var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 4rem;
  }

  .container {
    width: min(960px, 92%);
    margin: 0 auto;
    padding-top: 2.5rem;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 2rem;
    transition: transform 0.2s;
  }
  .back-link:hover {
    transform: translateX(-4px);
    text-decoration: underline;
  }

  header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .badge {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    background: color-mix(in srgb, var(--accent-2) 15%, transparent);
    color: var(--accent-2);
    border: 1px solid color-mix(in srgb, var(--accent-2) 30%, transparent);
    border-radius: 9999px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  header h1 {
    font-size: clamp(2rem, 5vw, 2.75rem);
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.02em;
    margin-bottom: 0.75rem;
  }

  header p {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 660px;
    margin: 0 auto;
  }

  /* ─── CONTROLS ─── */
  .controls-card {
    background: color-mix(in srgb, var(--card), transparent 20%);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 1.25rem 1.5rem;
    margin-bottom: 2.5rem;
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .search-wrapper {
    position: relative;
    width: 100%;
  }

  .search-input {
    width: 100%;
    padding: 0.8rem 1rem 0.8rem 2.75rem;
    border-radius: 0.75rem;
    border: 1px solid var(--border);
    background: #0d1326;
    color: var(--text);
    font-size: 0.95rem;
    transition: all 0.2s;
  }
  .search-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .tags-wrapper {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .filter-btn {
    background: #0d1326;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.4rem 0.9rem;
    border-radius: 0.5rem;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--muted);
  }
  .filter-btn.active {
    background: var(--accent);
    color: #0b1020;
    border-color: var(--accent);
    font-weight: 600;
  }

  /* ─── TIMELINE ─── */
  .timeline {
    position: relative;
    padding-left: 2.25rem;
  }
  .timeline::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 9px;
    width: 2px;
    background: linear-gradient(to bottom, var(--accent-2), var(--border) 90%);
  }

  .commit-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.85rem;
    margin-bottom: 1.5rem;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  }
  .commit-card:hover {
    border-color: color-mix(in srgb, var(--accent), transparent 60%);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  .commit-card::before {
    content: '';
    position: absolute;
    top: 1.5rem;
    left: -2.25rem;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent-2);
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 2px var(--border);
    z-index: 2;
  }

  .commit-card[data-cat="deploy"]::before { background: var(--rose); }
  .commit-card[data-cat="stream"]::before { background: var(--accent); }
  .commit-card[data-cat="demux"]::before { background: var(--purple); }
  .commit-card[data-cat="audio"]::before { background: var(--amber); }
  .commit-card[data-cat="video"]::before { background: var(--green); }
  .commit-card[data-cat="caps"]::before { background: var(--accent-2); }

  .commit-header {
    padding: 1.25rem 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    background: var(--card);
    user-select: none;
  }
  .commit-header:hover {
    background: var(--card-hover);
  }

  .commit-info {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    flex-grow: 1;
  }

  .commit-meta {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.85rem;
  }

  .hash {
    font-family: 'DM Mono', monospace;
    color: var(--accent-2);
    background: color-mix(in srgb, var(--accent-2) 15%, transparent);
    padding: 0.15rem 0.5rem;
    border-radius: 0.3rem;
    font-size: 0.85rem;
    font-weight: 500;
  }

  .date {
    color: var(--muted);
    font-size: 0.8rem;
  }

  .cat-badge {
    font-size: 0.72rem;
    padding: 0.1rem 0.45rem;
    border-radius: 0.25rem;
    background: color-mix(in srgb, var(--border), #fff 10%);
    color: var(--muted);
  }

  .subject {
    font-weight: 600;
    font-size: 1.05rem;
    color: #ffffff;
    line-height: 1.4;
  }

  .chevron {
    color: var(--muted);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-size: 0.8rem;
  }

  .commit-body {
    padding: 1.5rem;
    border-top: 1px solid var(--border);
    background: #0b1124;
    display: none;
  }

  .commit-card.expanded .commit-body {
    display: block;
    animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .commit-card.expanded .chevron {
    transform: rotate(180deg);
  }

  .body-text {
    color: #cbd5e1;
    font-size: 0.92rem;
    white-space: pre-wrap;
    margin-bottom: 1.25rem;
    font-family: 'DM Mono', monospace;
    background: rgba(0,0,0,0.25);
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    border-left: 3px solid var(--border);
  }

  /* ─── DEV LOG BUBBLE ─── */
  .dev-log {
    background: linear-gradient(135deg, #131e3b 0%, #1a274c 100%);
    border: 1px solid #2b3e6c;
    border-radius: 0.75rem;
    padding: 1.25rem 1.5rem;
    position: relative;
    margin-top: 1rem;
    white-space: pre-wrap;
  }

  .dev-log-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 700;
    color: var(--accent);
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
  }

  .dev-log-content {
    color: #e2e8f0;
    font-size: 0.95rem;
    line-height: 1.6;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .empty-state {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
  }

  @media (max-width: 640px) {
    .timeline { padding-left: 1.75rem; }
    .timeline::before { left: 5px; }
    .commit-card::before { left: -1.75rem; width: 12px; height: 12px; top: 1.6rem; }
    .commit-header { padding: 1rem 1.25rem; }
    .commit-body { padding: 1.25rem; }
  }
</style>
</head>

</div>

    return String(str)

      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  const timelineEl = document.getElementById('commitsTimeline');
  const searchInput = document.getElementById('searchInput');
  const filterBtns = document.querySelectorAll('.filter-btn');

  let activeCategory = 'all';
  let searchTerm = '';

  function renderCommits() {
    timelineEl.innerHTML = '';

    const filtered = commitData.filter(item => {
      const matchCat = (activeCategory === 'all') || (item.cat === activeCategory);
      const matchSearch = !searchTerm ||
        item.subject.toLowerCase().includes(searchTerm) ||
        item.body.toLowerCase().includes(searchTerm) ||
        item.story.toLowerCase().includes(searchTerm) ||
        item.hash.toLowerCase().includes(searchTerm);
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      timelineEl.innerHTML = `
        <div class="empty-state">
          <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">🔍 找不到符合條件的開發紀錄</p>
          <p style="color: var(--muted); font-size: 0.9rem;">嘗試搜尋其他關鍵字或切換類別標籤</p>
        </div>
      `;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'commit-card';
      card.setAttribute('data-cat', item.cat);

      card.innerHTML = `
        <div class="commit-header">
          <div class="commit-info">
            <div class="commit-meta">
              <span class="hash">${escapeHtml(item.hash)}</span>
              <span class="date">${escapeHtml(item.date)}</span>
              <span class="cat-badge">${escapeHtml(item.catName)}</span>
            </div>
            <div class="subject">${escapeHtml(item.subject)}</div>
          </div>
          <div class="chevron">▼</div>
        </div>
        <div class="commit-body">
          <div class="body-text">${escapeHtml(item.body)}</div>
          <div class="dev-log">
            <div class="dev-log-header">
              <span>💡</span>
              <span>${escapeHtml(item.storyTitle)}</span>
            </div>
            <div class="dev-log-content">${escapeHtml(item.story)}</div>
          </div>
        </div>
      `;

      card.querySelector('.commit-header').addEventListener('click', () => {
        const isExpanded = card.classList.contains('expanded');
        // Close other expanded cards
        document.querySelectorAll('.commit-card.expanded').forEach(c => {
          if (c !== card) c.classList.remove('expanded');
        });
        card.classList.toggle('expanded', !isExpanded);
      });

      timelineEl.appendChild(card);
    });
  }

  // Filter Listeners
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.getAttribute('data-filter');
      renderCommits();
    });
  });

  searchInput.addEventListener('input', (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderCommits();
  });

  // Initial Render
  renderCommits();
</script>
</body>
</html>
